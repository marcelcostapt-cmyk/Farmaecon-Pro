name: farmaecon-observation
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: farmaecon
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run local-init first}
      POSTGRES_DB: farmaecon_observation
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["observation-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmaecon -d farmaecon_observation"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:63799:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://farmaecon:${LOCAL_DB_PASSWORD}@db:5432/farmaecon_observation
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Generate the runtime key}
    command: ["node", "scripts/database-migrate.mjs"]
    depends_on:
      db: { condition: service_healthy }
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://farmaecon_runtime:${RUNTIME_DB_PASSWORD:?Generate the runtime key}@db:5432/farmaecon_observation
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      LOCAL_SIMULATION: "true"
      MARKETPLACE_SOURCE: MOCK
      MARKETPLACE_MODE: OBSERVATION
      FRONTEND_URL: http://localhost:3000
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HOST: 0.0.0.0
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:3001/api/v1
      FRONTEND_URL: http://localhost:3000
      LOCAL_SIMULATION: "true"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  observation-db:
