# Overlay: always combine with docker-compose.prod.yml.
# Resolve the network and ACME resolver from the existing Traefik first.
services:
  api:
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:?Set the verified Docker network}
      traefik.http.routers.farmaecon-api.rule: Host(`${API_DOMAIN:?Set API_DOMAIN}`)
      traefik.http.routers.farmaecon-api.entrypoints: websecure
      traefik.http.routers.farmaecon-api.tls: 'true'
      traefik.http.routers.farmaecon-api.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:?Set the existing ACME resolver}
      traefik.http.services.farmaecon-api.loadbalancer.server.port: '3001'
  web:
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:?Set the verified Docker network}
      traefik.http.routers.farmaecon-web.rule: Host(`${APP_DOMAIN:?Set APP_DOMAIN}`)
      traefik.http.routers.farmaecon-web.entrypoints: websecure
      traefik.http.routers.farmaecon-web.tls: 'true'
      traefik.http.routers.farmaecon-web.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:?Set the existing ACME resolver}
      traefik.http.services.farmaecon-web.loadbalancer.server.port: '3000'
networks:
  web:
    external: true
    name: ${TRAEFIK_NETWORK:?Set the verified Docker network}
